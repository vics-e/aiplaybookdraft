<!doctype html>

      strong { color: #00dc51; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 16px 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); }
      p { color: #c9d2cc; line-height: 1.6; }
      a { display: inline-block; margin-top: 18px; border-radius: 999px; padding: 12px 20px; background: #00dc51; color: #000; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
