<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>AI Playbook sharing artwork</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: white; font-family: Arial, Helvetica, sans-serif; }
  .background { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.5), transparent 85%); }
  .logo { position: absolute; left: 64px; top: 46px; width: 112px; height: auto; }
  .label { position: absolute; top: 60px; right: 64px; font-size: 17px; letter-spacing: 2.2px; font-weight: 700; color: #d1e3d8; }
  .copy { position: absolute; left: 64px; top: 165px; }
  h1 { margin: 0 0 18px; font-size: 86px; letter-spacing: -4px; line-height: 1.04; font-weight: 900; }
  .audience { margin: 0; font-size: 48px; line-height: 1.1; letter-spacing: -1.5px; font-weight: 700; }
  .tagline { margin: 32px 0 0; font-size: 32px; line-height: 1.2; letter-spacing: -.5px; font-weight: 700; color: #00dc51; }
  .support { margin: 12px 0 0; font-size: 22px; color: #e0e8e4; }
  .footer { position: absolute; bottom: 42px; left: 64px; font-size: 18px; letter-spacing: .3px; color: #b4c0ba; }
  .arrow { position: absolute; right: 64px; bottom: 38px; color: #00dc51; font-size: 36px; }
  body[data-layout="square"] .card { width: 1080px; height: 1080px; }
  body[data-layout="square"] .background { object-position: 65% center; }
  body[data-layout="square"] .shade { background: linear-gradient(180deg, rgba(0,0,0,.3), transparent 75%); }
  body[data-layout="square"] .logo { left: 72px; top: 72px; width: 140px; }
  body[data-layout="square"] .label { right: 72px; top: 100px; font-size: 20px; }
  body[data-layout="square"] .copy { left: 72px; top: 310px; }
  body[data-layout="square"] h1 { max-width: 800px; font-size: 112px; line-height: .98; letter-spacing: -5px; margin-bottom: 38px; }
  body[data-layout="square"] .audience { font-size: 58px; }
  body[data-layout="square"] .tagline { font-size: 40px; margin-top: 56px; color: white; }
  body[data-layout="square"] .support { font-size: 27px; margin-top: 18px; }
  body[data-layout="square"] .footer { left: 72px; bottom: 64px; font-size: 23px; }
  body[data-layout="square"] .arrow { right: 72px; bottom: 55px; font-size: 48px; }
</style>
<body data-layout="wide">
  <main class="card">
    <img class="background" src="../../src/assets/7d10c58b13d65e57e14197ae9cce3c931f5cc649.png" alt="">
    <div class="shade"></div>
    <img class="logo" src="../../src/assets/85dce1db2c171f8d15f5e966d3ca5f37099a8078.png" alt="Sage">
    <div class="label">INTERACTIVE GUIDE</div>
    <div class="copy">
      <h1>The AI Playbook</h1>
      <p class="audience">For Accountants &amp;<br>Bookkeepers</p>
      <p class="tagline">Build your AI-ready practice.</p>
      <p class="support">From assistants to agents.</p>
    </div>
    <div class="footer">aiplaybook-ve.vercel.app</div>
    <div class="arrow" aria-hidden="true">↗</div>
  </main>
</body>
</html>
