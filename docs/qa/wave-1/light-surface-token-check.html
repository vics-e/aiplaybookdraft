<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave 1 light surface token check</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: var(--color-page-background);
        font-family: var(--font-family-body);
      }

      main {
        width: min(680px, calc(100% - 40px));
        padding: 40px;
        border: 1px solid var(--color-rule);
      }

      h1 {
        margin: 12px 0 16px;
        font-family: var(--font-family-header);
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1;
      }

      p { line-height: 1.6; }
      a { font-weight: 800; }
    </style>
  </head>
  <body>
    <main class="playbook-light-surface">
      <div class="playbook-page-eyebrow">Light surface verification</div>
      <h1>Semantic contrast check</h1>
      <p>Primary information uses black text on white. Green is reserved for the identifier and accessible link treatment.</p>
      <a href="#verified">Verified link treatment</a>
    </main>
  </body>
</html>
